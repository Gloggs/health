<?xml version="1.0" encoding="UTF-8"?>
<!--
  Etch horizontal wordmark, DARK-MODE variant. Swaps:
    - ink #1A1410 → cream #F0EAD8 (per BRAND.md dark-mode ink token)
    - ox-blood #A4271E → brightened #D8483A (BRAND.md dark accent)
  Transparent background so it composites on the dark paper (#15110D)
  Kinde uses when in dark mode.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" fill="none">
  <!-- 4 vertical cream strokes -->
  <g stroke="#F0EAD8" stroke-width="10" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="120"/>
    <line x1="62" y1="40" x2="62" y2="120"/>
    <line x1="84" y1="40" x2="84" y2="120"/>
    <line x1="106" y1="40" x2="106" y2="120"/>
  </g>
  <!-- 5th diagonal slash in brightened ox-blood -->
  <line x1="30" y1="120" x2="118" y2="40" stroke="#D8483A" stroke-width="13" stroke-linecap="round"/>

  <!-- "Etch" wordmark in cream -->
  <text x="178" y="118"
        font-family="Georgia, 'Source Serif 4', 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#F0EAD8"
        letter-spacing="-2">Etch</text>
</svg>
