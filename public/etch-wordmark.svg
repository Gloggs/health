<?xml version="1.0" encoding="UTF-8"?>
<!--
  Etch horizontal wordmark — 4 vertical ink strokes + 1 ox-blood
  diagonal on the left, "Etch" in serif on the right. Transparent
  background so it sits cleanly on the paper-coloured Kinde sign-in
  screen (and any future light-mode surface). Per BRAND.md §1+§2.

  Used on:
    - Kinde branding header
    - Resend email templates
    - any future light-mode embedded surface
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" fill="none">
  <!-- 4 vertical ink strokes (mark) -->
  <g stroke="#1A1410" stroke-width="10" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="120"/>
    <line x1="62" y1="40" x2="62" y2="120"/>
    <line x1="84" y1="40" x2="84" y2="120"/>
    <line x1="106" y1="40" x2="106" y2="120"/>
  </g>
  <!-- 5th diagonal slash in ox-blood accent -->
  <line x1="30" y1="120" x2="118" y2="40" stroke="#A4271E" stroke-width="13" stroke-linecap="round"/>

  <!-- "Etch" wordmark. Georgia + Times fallback so renderers without
       Source Serif 4 still produce a serif. Letter-spacing tightens
       the serif a touch so it sits as a logo, not body copy. -->
  <text x="178" y="118"
        font-family="Georgia, 'Source Serif 4', 'Times New Roman', serif"
        font-size="110"
        font-weight="700"
        fill="#1A1410"
        letter-spacing="-2">Etch</text>
</svg>
